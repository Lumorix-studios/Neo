<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle gradient for the AI cursor block -->
    <linearGradient id="neoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5b4fc"/> <!-- Soft Indigo -->
    </linearGradient>
  </defs>
  
  <!-- Dark, sleek app icon background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  
  <!-- Subtle interface/code bracket -->
  <path d="M 220 160 L 120 256 L 220 352" 
        fill="none" 
        stroke="#52525b" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Forward-leaning AI cursor block -->
  <path d="M 280 376 L 360 136 L 416 136 L 336 376 Z" 
        fill="url(#neoGradient)"/>
</svg>
